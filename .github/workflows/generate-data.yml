name: Generate Data & Deploy to GitHub Pages

# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: For the "Run workflow" button to appear in the Actions tab,
# this file must exist on your repository's default branch (main/master).
# Push this file first, then the button will be visible.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Manual trigger — visible as "Run workflow" button in the Actions tab
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy to GitHub Pages after generating data?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

  # Automatic — fires whenever xlsx files are pushed to data/
  push:
    branches: [main, master]
    paths:
      - "data/*.xlsx"
      - "data/*.xls"

# Allow writing back to the repo and deploying to Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Generate data.js from xlsx files
  # ───────────────────────────────────────────────────────────────────────────
  generate:
    name: Generate data.js
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for xlsx files in data/
        run: |
          echo "Files in data/:"
          ls -lh data/ 2>/dev/null || echo "  (empty)"
          if ! ls data/*.xlsx data/*.xls 2>/dev/null | grep -q .; then
            echo "::warning::No xlsx files found in data/ — data.js was not regenerated."
            echo "SKIP_GENERATE=true" >> $GITHUB_ENV
          else
            echo "SKIP_GENERATE=false" >> $GITHUB_ENV
          fi

      - name: Generate data.js
        if: env.SKIP_GENERATE == 'false'
        run: python scripts/generate_data.py

      - name: Commit updated data.js files
        if: env.SKIP_GENERATE == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add solution1/data.js solution2/data.js solution3/data.js
          if git diff --cached --quiet; then
            echo "No changes to data.js — skipping commit."
          else
            SOURCES=$(ls data/*.xlsx data/*.xls 2>/dev/null | xargs -I{} basename {} | tr '\n' ', ' | sed 's/, $//')
            git commit -m "chore: regenerate data.js from [${SOURCES}]"
            git push
          fi

      - name: Upload Pages artifact
        if: >
          github.event_name == 'push' ||
          github.event.inputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to GitHub Pages
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: generate
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.deploy_pages == 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print live URLs
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          echo "## ✅ Deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Solution | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Solution 1 — Standalone site | [${BASE}solution1/](${BASE}solution1/) |" >> $GITHUB_STEP_SUMMARY
          echo "| Solution 2 — Embeddable widget demo | [${BASE}solution2/demo-search-page.html](${BASE}solution2/demo-search-page.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| Solution 3 — Progressive web app | [${BASE}solution3/](${BASE}solution3/) |" >> $GITHUB_STEP_SUMMARY
