name: Generate Timetable Data

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  # 1. Manual trigger from the Actions tab — upload new xlsx files first,
  #    commit them to data/, then run this workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build data.js but do NOT commit)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  # 2. Automatic trigger whenever xlsx files are pushed to the data/ directory
  push:
    paths:
      - "data/*.xlsx"
      - "data/*.xls"

# ─────────────────────────────────────────────────────────────────────────────
# Permissions — needed to commit the generated data.js files back to the repo
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write

jobs:
  generate:
    name: Generate data.js from xlsx
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch with a token so the subsequent push step works
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Dependencies ──────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install pandas openpyxl

      # ── 4. Verify source files exist ─────────────────────────────────────
      - name: Check for xlsx files in data/
        run: |
          echo "Files present in data/:"
          ls -lh data/ || echo "  (data/ directory is empty or missing)"
          
          # Fail early with a clear message if no xlsx files found
          if ! ls data/*.xlsx data/*.xls 2>/dev/null | grep -q .; then
            echo ""
            echo "ERROR: No .xlsx or .xls files found in data/"
            echo "Please commit your xlsx exports to the data/ directory and re-run."
            exit 1
          fi

      # ── 5. Generate ──────────────────────────────────────────────────────
      - name: Generate data.js
        run: python scripts/generate_data.py

      # ── 6. Verify output ─────────────────────────────────────────────────
      - name: Verify generated files
        run: |
          for sol in solution1 solution2 solution3; do
            if [ -f "$sol/data.js" ]; then
              SIZE=$(wc -c < "$sol/data.js")
              echo "✓ $sol/data.js  ($SIZE bytes)"
            else
              echo "✗ $sol/data.js  MISSING"
              exit 1
            fi
          done

      # ── 7. Commit & push (skipped on dry run) ────────────────────────────
      - name: Commit updated data.js files
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add solution1/data.js solution2/data.js solution3/data.js

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to data.js files — skipping commit."
          else
            # Include the source filename(s) in the commit message
            SOURCES=$(ls data/*.xlsx data/*.xls 2>/dev/null | xargs -I{} basename {} | tr '\n' ', ' | sed 's/, $//')
            git commit -m "chore: regenerate data.js from xlsx [${SOURCES}]

Auto-generated by the Generate Timetable Data workflow.
Source files: ${SOURCES}"
            git push
            echo "✓ data.js files committed and pushed."
          fi

      # ── 8. Summary ───────────────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          echo "## Timetable Data Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for sol in solution1 solution2 solution3; do
            if [ -f "$sol/data.js" ]; then
              SIZE=$(wc -c < "$sol/data.js")
              echo "- ✅ \`$sol/data.js\` — ${SIZE} bytes" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ \`$sol/data.js\` — not generated" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "> ⚠️ Dry run — files were generated locally but **not committed**." >> $GITHUB_STEP_SUMMARY
          else
            echo "> Files committed and pushed to \`${{ github.ref_name }}\`." >> $GITHUB_STEP_SUMMARY
          fi
